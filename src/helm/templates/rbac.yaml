---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nsupdate-operator-account
  namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nsupdate-operator-role
  namespace: {{ .Values.namespace.name }}
rules:
  # Application: access for its configuration on a configmap.
  - apiGroups: [""]
    resources: [configmaps]
    verbs:
      - list
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nsupdate-operator-rolebinding
  namespace: {{ .Values.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nsupdate-operator-role
subjects:
  - kind: ServiceAccount
    name: nsupdate-operator-account
    namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nsupdate-operator-role-cluster
rules:
  # Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings]
    verbs:
      - list
      - watch
  # Framework: runtime observation of namespaces & CRDs (addition/deletion).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: ['list', 'watch']
  - apiGroups: [""]
    resources: [namespaces]
    verbs:
      - list
      - watch
  # Framework: admission webhook configuration management.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs:
      - create
      - patch
      - delete
  # Application: access for watching cluster-wide.
  - apiGroups: [stable.devopstools]
    resources: [dnsrecords]
    verbs:
      - list
      - watch
      - patch
      - get
      - create
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs:
      - list
      - watch
      - patch
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nsupdate-operator-clusterrolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nsupdate-operator-role-cluster
subjects:
  - kind: ServiceAccount
    name: nsupdate-operator-account
    namespace: {{ .Values.namespace.name }}