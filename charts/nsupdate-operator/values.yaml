namespace: 
  create: true # Whether this chart needs to create the namespace or not
  name: nsupdate-operator # Namespace to deploy this chart. Take into account this is important for sealed-secrets
image: # Self explanatory
  registry: docker.io
  name: jesusro/nsupdate-operator
  tag: v0.0.1-alpha
config: # Application's config
  owner: "best-devops-team" # Used to flag dns entries ownership on a TXT record associated
  master: # DNS master configuration to send NSUPDATE requests
    server: "192.168.1.1" # This can be an fqdn, it will be resolved by helm, but app only allows IP
    user: "environment."
    algorithm: "hmac-sha512"
    port: 6953
    timeout: 5
  dnsrFromIngress: true # Enable watching of Ingresses to create dnsrs based on standards
  standards: # Used for annotations on ingresses. Each key will be matching nsupdate-operator value annotation
    - key: istio
      target: "ist-ssl.environment.devops."
      type: "CNAME"
    - key: nginx
      target: "ing-ssl.environment.devops."
      type: "CNAME"
    - key: pod
      target: "pod-ssl.environment.devops."
      type: "CNAME"
    - key: http
      target: "nop-ssl.environment.devops."
      type: "CNAME"
    - key: pfsense
      target: "6.9.6.9"
      type: "A"
  zones: # Used for whilisting zone of dnsr
    - environment.local
    - environment.devops
    - external
  webhook: # For validation of unique dnsr records on the clustter
    enabled: true
    ca: 
  sealedsecret: # Use sealed secrets (instead of direct secrets)
    enabled: false 
    masterKey: 
    webhookCertificate:
      server: 
      key: 
