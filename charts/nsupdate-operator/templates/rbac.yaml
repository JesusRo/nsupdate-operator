---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nsupdate-operator-account
  namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nsupdate-operator-role
  namespace: {{ .Values.namespace.name }}
rules:
  # Application: access for its configuration on a configmap.
  - apiGroups: [""]
    resources: [configmaps]
    verbs:
      - list
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nsupdate-operator-rolebinding
  namespace: {{ .Values.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nsupdate-operator-role
subjects:
  - kind: ServiceAccount
    name: nsupdate-operator-account
    namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nsupdate-operator-role-cluster
rules:
  # Application: access for getting namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs:
      - list
      - watch
  # Application: access for watching ingress and managing crds cluster-wide.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs:
      - list
      - watch
  - apiGroups: [stable.devopstools]
    resources: [dnsrecords]
    verbs:
      - list
      - watch
      - patch
      - get
      - create
      - delete
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs:
      - list
      - watch
      - patch
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nsupdate-operator-clusterrolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nsupdate-operator-role-cluster
subjects:
  - kind: ServiceAccount
    name: nsupdate-operator-account
    namespace: {{ .Values.namespace.name }}